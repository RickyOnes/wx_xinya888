http_port 3128
visible_hostname squid-proxy-xinya888

# --- Auth configuration ---
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 5
auth_param basic realm Proxy
auth_param basic credentialsttl 2 hours
acl auth_users proxy_auth REQUIRED

# --- Safe ports and CONNECT handling ---
acl Safe_ports port 80        # http
acl Safe_ports port 21        # ftp
acl Safe_ports port 443       # https
acl Safe_ports port 70        # gopher
acl Safe_ports port 210       # wais
acl Safe_ports port 1025-65535
acl SSL_ports port 443
acl CONNECT method CONNECT

# --- Localhost and manager ---
acl localhost src 127.0.0.1/32 ::1
acl manager proto cache_object
http_access allow manager localhost
http_access deny manager

# Allow local requests (for debug/update)
http_access allow localhost

# --- Allowed destination domains (restrict to Google related) ---
acl google_sites dstdomain .google.com .gstatic.com .googleusercontent.com .googleapis.com accounts.google.com

# Deny CONNECT to ports other than SSL_ports
http_access deny CONNECT !SSL_ports

# Require authentication for proxy use; allow authenticated users to access any destination
# (temporary for testing; restrict to google_sites after verification)
http_access allow auth_users

# Deny everything else
http_access deny all

# --- Logging: write logs to files in /var/log/squid (entrypoint tails these files) ---
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Privacy headers
forwarded_for off
via off
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Forwarded deny all
request_header_access Proxy-Authorization allow all
