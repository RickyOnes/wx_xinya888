name: 快速更新预估销量参数
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v6

    - name: 获取今天日期（上海时区）
      id: date
      run: echo "date=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: 恢复当天的用户数据缓存
      id: restore-cache
      uses: actions/cache/restore@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-${{ steps.date.outputs.date }}

    - name: 运行快速预估销量参数捕获脚本
      env:
        NODE_PATH: /app/node_modules
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PDD_ACCOUNTS_JSON: ${{ secrets.PDD_ACCOUNTS_JSON }}
        PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
        PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
        PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
        TZ: Asia/Shanghai
      run: node scripts/quick-plan-update.js

    - name: 保存当天用户数据缓存（仅第一次运行）
      if: steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-${{ steps.date.outputs.date }}