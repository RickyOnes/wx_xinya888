# 每天6-16点、17-23点期间执行分别只保存一次缓存。一天只保存2次缓存

name: 快速更新预估销量参数
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v6

    - name: 获取上海日期和小时
      id: datetime
      run: |
        DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
        HOUR=$(TZ=Asia/Shanghai date +'%H')
        echo "date=$DATE" >> $GITHUB_OUTPUT
        echo "hour=$HOUR" >> $GITHUB_OUTPUT

    - name: 确定缓存时段（早间 0-16，晚间 17-23）
      id: slot
      run: |
        HOUR=${{ steps.datetime.outputs.hour }}
        if [ "$HOUR" -lt 17 ]; then
          echo "slot=early" >> $GITHUB_OUTPUT
        else
          echo "slot=late" >> $GITHUB_OUTPUT
        fi

    - name: 恢复当天时段用户数据缓存
      id: restore-cache
      uses: actions/cache/restore@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-${{ steps.datetime.outputs.date }}-${{ steps.slot.outputs.slot }}

    - name: 运行快速预估销量参数捕获脚本
      env:
        NODE_PATH: /app/node_modules
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PDD_ACCOUNTS_JSON: ${{ secrets.PDD_ACCOUNTS_JSON }}
        PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
        PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
        PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
        TZ: Asia/Shanghai
      run: node scripts/quick-plan-update.js

    - name: 保存当天时段用户数据缓存（各时段每天仅第一次）
      if: steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-${{ steps.datetime.outputs.date }}-${{ steps.slot.outputs.slot }}