name: 快速更新预估销量参数
on:
  workflow_dispatch:
    inputs:
      script:
        description: '选择要运行的脚本'
        required: true
        type: choice
        options:
          - quick-plan-update.js          # 非并发日常版
          - clean-browser-profiles.js      # 清理用户数据文件（定期运行，保持环境干净）
        default: quick-plan-update.js
  repository_dispatch:
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v6

    - name: 获取上海日期
      id: date
      run: echo "date=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: 恢复用户数据缓存（前缀匹配最新）
      id: restore-cache
      uses: actions/cache/restore@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-user-data-【${{ steps.date.outputs.date }}】-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-拼多多-user-data-

    - name: 从镜像备份恢复 Cookie 文件（仅在无本地 Cookie 时）
      run: |
        mkdir -p ./puppeteer_user_data
        if [ ! -f ./puppeteer_user_data/cookie_*.json ]; then
          if [ -d /app/cookie_defaults ]; then
            cp /app/cookie_defaults/cookie_*.json ./puppeteer_user_data/ 2>/dev/null || true
            echo "✅ 已从镜像备份恢复 Cookie 文件（首次运行）"
          else
            echo "⚠️ 无镜像备份，脚本将尝试自动登录"
          fi
        else
          echo "ℹ️ 用户数据中已存在 Cookie 文件，跳过镜像备份恢复"
        fi

    - name: 创建时间戳标记文件
      run: touch ./puppeteer_user_data/.pre_run_ref

    - name: 运行所选脚本
      env:
        NODE_PATH: /app/node_modules
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PDD_ACCOUNTS_JSON: ${{ secrets.PDD_ACCOUNTS_JSON }}
        PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
        PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
        PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
        PDD_FIRST_RUN: ${{ secrets.PDD_FIRST_RUN }} # 标记是否首次运行（无缓存）
        TZ: Asia/Shanghai
      run: node scripts/${{ inputs.script || 'quick-plan-update.js' }}

    - name: 检查是否刷新了凭证（Cookie 文件是否被更新）
      id: check-refresh
      run: |
        if find ./puppeteer_user_data -maxdepth 1 -name 'cookie_*.json' -newer ./puppeteer_user_data/.pre_run_ref | grep -q .; then
          echo "refreshed=true" >> $GITHUB_OUTPUT
          echo "✅ 检测到 Cookie 文件已更新，凭证已刷新，需要保存新的用户数据缓存"
        else
          echo "refreshed=false" >> $GITHUB_OUTPUT
          echo "ℹ️ Cookie 文件未更新，跳过缓存保存"
        fi

    - name: 保存用户数据缓存（仅当凭证刷新时）
      if: steps.check-refresh.outputs.refreshed == 'true'
      uses: actions/cache/save@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-user-data-【${{ steps.date.outputs.date }}】-${{ github.run_id }}