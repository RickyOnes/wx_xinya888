name: 快速更新预估销量参数
on:
  workflow_dispatch:
    inputs:
      script:
        description: '选择要运行的脚本'
        required: true
        type: choice
        options:
          - quick-plan-update.js          # 非并发日常版
          - quick-plan-update-con.js      # 并发版
        default: quick-plan-update.js
  repository_dispatch:
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v6

    - name: 获取上海日期和小时
      id: datetime
      run: |
        DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
        HOUR=$(TZ=Asia/Shanghai date +'%H')
        echo "date=$DATE" >> $GITHUB_OUTPUT
        echo "hour=$HOUR" >> $GITHUB_OUTPUT

    - name: 确定缓存时段（早间 0-16，晚间 17-23）
      id: slot
      run: |
        HOUR=${{ steps.datetime.outputs.hour }}
        if [ "$HOUR" -lt 17 ]; then
          echo "slot=early" >> $GITHUB_OUTPUT
        else
          echo "slot=late" >> $GITHUB_OUTPUT
        fi

    - name: 恢复用户数据缓存（跨时段前缀匹配）
      id: restore-cache
      uses: actions/cache/restore@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-user-data-${{ steps.datetime.outputs.date }}-${{ steps.slot.outputs.slot }}
        restore-keys: |
          ${{ runner.os }}-拼多多-user-data-

    - name: 从镜像备份恢复 Cookie 文件（仅在无本地 Cookie 时）
      run: |
        mkdir -p ./puppeteer_user_data
        if [ ! -f ./puppeteer_user_data/cookie_*.json ]; then
          if [ -d /app/cookie_defaults ]; then
            cp /app/cookie_defaults/cookie_*.json ./puppeteer_user_data/ 2>/dev/null || true
            echo "✅ 已从镜像备份恢复 Cookie 文件（首次运行）"
          else
            echo "⚠️ 无镜像备份，脚本将尝试自动登录"
          fi
        else
          echo "ℹ️ 用户数据中已存在 Cookie 文件，跳过镜像备份恢复"
        fi

    - name: 运行所选脚本
      env:
        NODE_PATH: /app/node_modules
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PDD_ACCOUNTS_JSON: ${{ secrets.PDD_ACCOUNTS_JSON }}
        PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
        PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
        PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
        TZ: Asia/Shanghai
      run: node scripts/${{ inputs.script || 'quick-plan-update.js' }}

    - name: 保存用户数据缓存（覆盖当天时段最新）
      uses: actions/cache/save@v5
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-拼多多-user-data-${{ steps.datetime.outputs.date }}-${{ steps.slot.outputs.slot }}