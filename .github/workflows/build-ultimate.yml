name: 创建 RustDesk + 爬虫镜像

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.ultimate'
      - 'start-ultimate.sh'
      - 'scripts/**'
      - 'package-ghost.json'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ultimate
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ultimate-crawler:latest