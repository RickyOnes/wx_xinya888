name: Build and Push to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.vnc'
      - 'start.sh'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.vnc
          push: true
          tags: |
            ghcr.io/rickones/vnc-browser:latest