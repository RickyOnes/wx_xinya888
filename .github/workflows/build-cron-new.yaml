name: 构建VNC + noVNC 爬虫镜像并推送【GHCR/腾讯云TCR】双仓库

on:
  push:
    branches: [ main ]
    paths: 
      - 'Dockerfile.cron'
      - 'start-cron.sh'
      - 'package-cron.json'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🛎️ 检出代码
        uses: actions/checkout@v6

      - name: 🐳 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 配置 QEMU (多架构支持)
        uses: docker/setup-qemu-action@v4

      # -------------------------------------------------
      # 1. 登录镜像仓库 (同时登录两个平台)
      # -------------------------------------------------
      
      - name: 🔐 登录腾讯云镜像仓库 (TCR)
        uses: docker/login-action@v4
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          password: ${{ secrets.TENCENT_CLOUD_PASSWORD }}

      - name: 🔐 登录 GitHub 容器仓库 (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------
      # 2. 构建并推送 (关键修改: 这里指定所有目标地址)
      # -------------------------------------------------
      
      - name: 🏗️ 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cron
          push: true
          tags: |
            # A. 腾讯云标签
            ccr.ccs.tencentyun.com/rickyone/xinya888/cron-crawler:latest
            ccr.ccs.tencentyun.com/rickyone/xinya888/cron-crawler:${{ github.sha }}
            
            # B. 原有的 GHCR 标签
            ghcr.io/rickyones/cron-crawler:latest
            ghcr.io/rickyones/cron-crawler:${{ github.sha }}