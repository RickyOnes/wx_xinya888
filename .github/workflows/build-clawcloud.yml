name: 更新ClawCloud Token

on:
  schedule:
    # 每6天北京时间5点运行（UTC 21点，忽略夏令时）
    - cron: '0 21 */6 * *'
  workflow_dispatch:  # 支持手动触发
    inputs:
      headless:
        description: '是否以无头模式运行（true/false）'
        required: false
        default: 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/clawcloud-token-updater

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # 用于 OIDC 令牌（如果需要）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.clawcloud
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Run token updater container
        run: |
          docker run --rm \
            -e USERNAME_GITHUB="${{ secrets.USERNAME_GITHUB }}" \
            -e PASSWORD_GITHUB="${{ secrets.PASSWORD_GITHUB }}" \
            -e ACCESS_TOKEN_SUPABASE="${{ secrets.ACCESS_TOKEN_SUPABASE }}" \
            -e SUPABASE_PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF || 'iglmqwpagzjadwauvchh' }}" \
            -e HEADLESS="${{ github.event.inputs.headless || 'true' }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Logout from GitHub Container Registry
        if: always()
        run: docker logout ${{ env.REGISTRY }}