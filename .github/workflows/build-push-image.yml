name: Build and Push Simplified Docker Image to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'package.json'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push optimized Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/rickyones/pdd-crawler:latest
            ghcr.io/rickyones/pdd-crawler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max