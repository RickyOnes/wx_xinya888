name: 构建Squid代理镜像

on:
  push:
    branches: [ main ]
    paths:
      - 'proxy/**'
      - 'docker/squid/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use proxy/squid as build context
        id: detect
        run: |
          echo "context=proxy/squid" >> $GITHUB_OUTPUT
          echo "dockerfile=proxy/squid/Dockerfile" >> $GITHUB_OUTPUT

      - name: Set image names
        id: vars
        run: |
          # derive lowercase owner from GITHUB_REPOSITORY (owner/repo)
          owner="${GITHUB_REPOSITORY%%/*}"
          owner_lc="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/xinya-squid:${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "image_latest=ghcr.io/${owner_lc}/xinya-squid:latest" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.detect.outputs.context }}
          file: ${{ steps.detect.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.vars.outputs.image }},${{ steps.vars.outputs.image_latest }}
