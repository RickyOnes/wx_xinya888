name: 更新拼多多参数(新方法) - 带视频录制

on:
  workflow_dispatch:
    inputs:
      retry:           # 用于标记是否为重试运行
        description: '是否为重试运行'
        required: false
        default: 'false'
  repository_dispatch: # 支持外部API触发（由Supabase cron调用）
    types: [external_cron_trigger]

permissions:
  actions: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler-ghost:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: 获取当前日期
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 检测是否为重试运行
        id: check-retry
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RETRY_VALUE="${{ github.event.inputs.retry }}"
            # 如果为空，设置为 'false'
            if [ -z "$RETRY_VALUE" ]; then
              RETRY_VALUE="false"
            fi
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            RETRY_VALUE="${{ github.event.client_payload.retry }}"
            if [ -z "$RETRY_VALUE" ]; then
              RETRY_VALUE="false"
            fi
          else
            RETRY_VALUE="false"
          fi
          echo "retry=$RETRY_VALUE" >> $GITHUB_OUTPUT
          echo "检测到重试标志：retry=$RETRY_VALUE"

      - name: 调试：显示重试标志
        run: |
          echo "当前重试标志: ${{ steps.check-retry.outputs.retry }}"          

      # 第一步：尝试恢复缓存
      - name: 恢复 Puppeteer 用户数据缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-拼多多-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-拼多多-

      # 第二步：启动虚拟显示器、运行脚本并录制视频
      - name: 启动虚拟显示器、运行脚本并录制视频
        id: run-script
        run: |
          Xvfb :99 -screen 0 1366x768x24 &
          export DISPLAY=:99
          sleep 2

          ffmpeg -y -f x11grab -video_size 1366x768 -framerate 30 -i :99 \
                 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
                 -g 60 -movflags +faststart recording.mp4 2> ffmpeg.log &
          FFMPEG_PID=$!
          echo "📹 ffmpeg 已启动，PID: $FFMPEG_PID"

          START_TIME=$(date +%s)
          timeout 900 node scripts/update-pdd-new.js
          SCRIPT_EXIT_CODE=$?
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "⏱️ 脚本运行时间: $DURATION 秒"
          echo "📝 脚本退出码: $SCRIPT_EXIT_CODE"

          sleep 2
          kill $FFMPEG_PID 2>/dev/null || true
          wait $FFMPEG_PID 2>/dev/null || true

          if [ -f recording.mp4 ]; then
            FILE_SIZE=$(stat -c%s recording.mp4)
            echo "📹 录制视频文件大小: $FILE_SIZE 字节"
            if [ $FILE_SIZE -lt 102400 ]; then
              echo "⚠️  警告：录制视频文件大小小于 100KB，可能录制失败"
            fi
          else
            echo "❌ 录制视频文件未生成"
          fi

          if [ $DURATION -gt 150 ] || [ $SCRIPT_EXIT_CODE -ne 0 ]; then
            echo "should_upload_video=true" >> $GITHUB_OUTPUT
            echo "🎥 需要上传视频：运行时间超过150秒或脚本失败"
          else
            echo "should_upload_video=false" >> $GITHUB_OUTPUT
            echo "⏹️ 不需要上传视频：运行时间不超过150秒且脚本成功"
          fi

          if [ $SCRIPT_EXIT_CODE -eq 0 ] && [ $DURATION -le 150 ]; then
            echo "should_cache=true" >> $GITHUB_OUTPUT
            echo "💾 需要缓存用户数据：脚本成功且运行时间不超过150秒"
          else
            echo "should_cache=false" >> $GITHUB_OUTPUT
            echo "🚫 不需要缓存用户数据：脚本失败或运行时间超过150秒"
          fi

          exit $SCRIPT_EXIT_CODE
        env:
          NODE_PATH: /app/node_modules
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDD_ACCOUNTS: ${{ secrets.PDD_ACCOUNTS }}
          PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
          PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
          PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
          TZ: Asia/Shanghai
          DISPLAY: :99

      # 第三步：保存更新后的缓存
      - name: 保存 Puppeteer 用户数据缓存
        if: steps.run-script.outputs.should_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-拼多多-${{ steps.date.outputs.date }}-${{ github.run_id }}

      # 第四步：上传录制视频
      - name: 上传浏览器录制视频
        if: steps.run-script.outputs.should_upload_video == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording-${{ github.run_id }}
          path: recording.mp4
          if-no-files-found: warn

      # 第五步：当脚本失败且不是重试运行时，触发一次重试
      - name: 触发重试运行（仅当验证码导致的失败且不是重试）
        if: failure() && steps.run-script.outputs.verification_needed == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && steps.check-retry.outputs.retry != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = 'update-pdd-params-new.yml';
            
            console.log(`🚀 脚本因验证码失败，触发一次重试运行...`);
            
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: context.ref,
              inputs: {
                retry: 'true'   // 标记此次为重试
              }
            });
            
            console.log('✅ 重试工作流已触发。');