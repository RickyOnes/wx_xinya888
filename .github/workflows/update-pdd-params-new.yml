name: 更新拼多多参数(新方法) - 带视频录制

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装录制依赖
        run: |
          apt-get update
          apt-get install -y ffmpeg xvfb x11-xserver-utils

      - name: 获取当前日期
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 恢复 Puppeteer 用户数据缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-user-data-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pdd-user-data-

      - name: 启动虚拟显示器、运行脚本并录制视频
        run: |
          Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR -noreset &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 3
          
          if xdpyinfo -display :99 >/dev/null 2>&1; then
            echo "✅ Xvfb 启动成功"
          else
            echo "❌ Xvfb 启动失败"
            exit 1
          fi
          
          xsetroot -solid "#2c3e50" -display :99 2>/dev/null || true
          
          ffmpeg -y -f x11grab \
                 -video_size 1366x768 \
                 -framerate 30 \
                 -draw_mouse 1 \
                 -i :99.0 \
                 -c:v libx264 \
                 -preset veryfast \
                 -crf 23 \
                 -pix_fmt yuv420p \
                 -g 60 \
                 -movflags +faststart \
                 -t 1900 \
                 recording.mp4 2> ffmpeg.log &
          FFMPEG_PID=$!
          
          echo "📹 ffmpeg 已启动，PID: $FFMPEG_PID"

          timeout 1800 node scripts/update-pdd-new.js || true
          SCRIPT_EXIT_CODE=$?

          sleep 3

          kill -INT $FFMPEG_PID 2>/dev/null || true
          
          for i in {1..20}; do
            kill -0 $FFMPEG_PID 2>/dev/null || break
            sleep 0.5
          done
          
          kill -9 $FFMPEG_PID 2>/dev/null || true
          wait $FFMPEG_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true

          if [ -f recording.mp4 ]; then
            FILE_SIZE=$(stat -c%s recording.mp4)
            echo "📹 录制视频文件大小: $FILE_SIZE 字节 ($((FILE_SIZE/1024))KB)"
            if [ $FILE_SIZE -lt 102400 ]; then
              echo "⚠️  警告：录制视频文件小于 100KB，可能录制失败"
              echo "📝 FFmpeg 日志最后 30 行："
              tail -30 ffmpeg.log
            fi
          else
            echo "❌ 录制视频文件未生成"
            echo "📝 FFmpeg 完整日志："
            cat ffmpeg.log
          fi

          exit $SCRIPT_EXIT_CODE
        env:
          NODE_PATH: /app/node_modules
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDD_ACCOUNTS: ${{ secrets.PDD_ACCOUNTS }}
          PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
          PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
          PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
          TZ: Asia/Shanghai
          DISPLAY: :99

      - name: 保存 Puppeteer 用户数据缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-user-data-${{ steps.date.outputs.date }}-${{ github.run_id }}

      - name: 上传浏览器录制视频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording-${{ github.run_id }}
          path: recording.mp4
          if-no-files-found: warn