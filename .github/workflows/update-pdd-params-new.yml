name: 更新拼多多参数(新方法) - 带视频录制

on:
  workflow_dispatch: {}  # 支持手动触发
  repository_dispatch:   # 支持外部API触发（由Supabase cron调用）
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler-ghost:latest # 使用已安装视频录制功能的新镜像
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: 获取当前日期
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 第一步：尝试恢复缓存
      - name: 恢复 Puppeteer 用户数据缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-data-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pdd-data-

      # 第二步：启动虚拟显示器、运行脚本并录制视频（优化版）
      - name: 启动虚拟显示器、运行脚本并录制视频
        run: |
          # 启动 Xvfb（设置分辨率与浏览器视口一致）
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2  # 给Xvfb一点启动时间

          # 启动 ffmpeg 录制（优化参数：更高帧率、更清晰的编码）
          ffmpeg -y -f x11grab -video_size 1366x768 -framerate 30 -i :99 \
                 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
                 -g 60 -movflags +faststart recording.mp4 2> ffmpeg.log &
          FFMPEG_PID=$!
          echo "📹 ffmpeg 已启动，PID: $FFMPEG_PID"

          # 运行您的脚本（需将浏览器 headless 设置为 false）
          timeout 1800 node scripts/update-pdd-new.js || true
          SCRIPT_EXIT_CODE=$?

          # 脚本结束后等待 2 秒，确保录制尾部被捕获
          sleep 2

          # 停止 ffmpeg
          kill $FFMPEG_PID 2>/dev/null || true
          wait $FFMPEG_PID 2>/dev/null || true

          # 检查录制文件大小
          if [ -f recording.mp4 ]; then
            FILE_SIZE=$(stat -c%s recording.mp4)
            echo "📹 录制视频文件大小: $FILE_SIZE 字节"
            if [ $FILE_SIZE -lt 102400 ]; then
              echo "⚠️  警告：录制视频文件大小小于 100KB，可能录制失败"
            fi
          else
            echo "❌ 录制视频文件未生成"
          fi

          # 返回脚本的退出码（可选）
          exit $SCRIPT_EXIT_CODE
        env:
          NODE_PATH: /app/node_modules
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDD_ACCOUNTS: ${{ secrets.PDD_ACCOUNTS }}
          PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
          PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
          PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
          TZ: Asia/Shanghai
          DISPLAY: :99   # 确保脚本知道使用虚拟显示器

      # 第三步：保存更新后的缓存（仅当脚本成功时）
      - name: 保存 Puppeteer 用户数据缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-user-data-${{ steps.date.outputs.date }}-${{ github.run_id }}

      # 第四步：上传录制视频作为 artifact（总是上传，便于调试）
      - name: 上传浏览器录制视频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording-${{ github.run_id }}
          path: recording.mp4
          if-no-files-found: warn