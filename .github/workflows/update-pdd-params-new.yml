name: 更新拼多多参数(新方法) - 带视频录制

on:
  workflow_dispatch: {}  # 支持手动触发
  repository_dispatch:   # 支持外部API触发（由Supabase cron调用）
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/rickyones/pdd-crawler:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # 安装依赖
      - name: 安装录制依赖
        run: |
          apt-get update
          apt-get install -y ffmpeg xvfb x11-xserver-utils

      - name: 获取当前日期
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 第一步：尝试恢复缓存
      - name: 恢复 Puppeteer 用户数据缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-user-data-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pdd-user-data-

      # 第二步：启动虚拟显示器、运行脚本并录制视频
      - name: 启动虚拟显示器、运行脚本并录制视频
        run: |
          # 启动 Xvfb（标准参数，无 -cursor）
          Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR -noreset &
          XVFB_PID=$!
          export DISPLAY=:99
          
          # 等待 Xvfb 就绪
          sleep 3
          
          # 验证显示器
          if xdpyinfo -display :99 >/dev/null 2>&1; then
            echo "✅ Xvfb 启动成功"
          else
            echo "❌ Xvfb 启动失败"
            exit 1
          fi
          
          # 创建自定义光标（使用 X11 原生方式）
          # 创建一个简单的点状光标位图
          cat > /tmp/cursor.xbm << 'EOF'
#define cursor_width 16
#define cursor_height 16
static unsigned char cursor_bits[] = {
   0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
   0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
   0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
EOF
          
          # 设置背景为深色，光标为白色（对比明显）
          xsetroot -solid "#2c3e50" -display :99 2>/dev/null || true
          
          # 启动 ffmpeg 录制（核心：-draw_mouse 1 让 FFmpeg 自己绘制鼠标）
          # 这是关键：FFmpeg 会捕获 X11 鼠标位置并叠加绘制
          ffmpeg -y -f x11grab \
                 -video_size 1366x768 \
                 -framerate 30 \
                 -draw_mouse 1 \
                 -i :99.0 \
                 -c:v libx264 \
                 -preset veryfast \
                 -crf 23 \
                 -pix_fmt yuv420p \
                 -g 60 \
                 -movflags +faststart \
                 -t 1900 \
                 recording.mp4 2> ffmpeg.log &
          FFMPEG_PID=$!
          
          echo "📹 ffmpeg 已启动，PID: $FFMPEG_PID"

          # 运行脚本（确保 Puppeteer 中 headless: false）
          timeout 1800 node scripts/update-pdd-new.js || true
          SCRIPT_EXIT_CODE=$?

          # 脚本结束后等待 3 秒
          sleep 3

          # 优雅停止 ffmpeg
          kill -INT $FFMPEG_PID 2>/dev/null || true
          
          # 等待最多 10 秒让 FFmpeg 完成编码
          for i in {1..20}; do
            kill -0 $FFMPEG_PID 2>/dev/null || break
            sleep 0.5
          done
          
          # 强制终止
          kill -9 $FFMPEG_PID 2>/dev/null || true
          wait $FFMPEG_PID 2>/dev/null || true
          
          # 清理 Xvfb
          kill $XVFB_PID 2>/dev/null || true

          # 检查录制文件
          if [ -f recording.mp4 ]; then
            FILE_SIZE=$(stat -c%s recording.mp4)
            echo "📹 录制视频文件大小: $FILE_SIZE 字节 ($((FILE_SIZE/1024))KB)"
            if [ $FILE_SIZE -lt 102400 ]; then
              echo "⚠️  警告：录制视频文件小于 100KB，可能录制失败"
              echo "📝 FFmpeg 日志最后 30 行："
              tail -30 ffmpeg.log
            fi
          else
            echo "❌ 录制视频文件未生成"
            echo "📝 FFmpeg 完整日志："
            cat ffmpeg.log
          fi

          exit $SCRIPT_EXIT_CODE
        env:
          NODE_PATH: /app/node_modules
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDD_ACCOUNTS: ${{ secrets.PDD_ACCOUNTS }}
          PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
          PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
          PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
          TZ: Asia/Shanghai
          DISPLAY: :99

      # 第三步：保存更新后的缓存
      - name: 保存 Puppeteer 用户数据缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-user-data-${{ steps.date.outputs.date }}-${{ github.run_id }}

      # 第四步：上传录制视频
      - name: 上传浏览器录制视频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recording-${{ github.run_id }}
          path: recording.mp4
          if-no-files-found: warn