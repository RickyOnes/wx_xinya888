name: 运行 ClawCloud Token 更新器

on:
  workflow_dispatch:
    inputs:
      headless:
        description: '是否以无头模式运行（true/false）'
        required: false
        default: 'true'
      image_tag:
        description: '镜像标签，例如 latest 或 sha-955439b'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rickyones/wx_xinya888/clawcloud-token-updater

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 显示本次运行镜像
        run: echo "使用镜像 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag || 'latest' }}"

      - name: 拉取指定镜像
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag || 'latest' }}

      - name: 运行 Token 更新容器
        run: |
          docker run --rm \
            --user root \
            -e USERNAME_GITHUB="${{ secrets.USERNAME_GITHUB }}" \
            -e PASSWORD_GITHUB="${{ secrets.PASSWORD_GITHUB }}" \
            -e ACCESS_TOKEN_SUPABASE="${{ secrets.ACCESS_TOKEN_SUPABASE }}" \
            -e SUPABASE_PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF || 'iglmqwpagzjadwauvchh' }}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -e HEADLESS="${{ github.event.inputs.headless || 'true' }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag || 'latest' }}
