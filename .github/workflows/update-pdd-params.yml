name: 更新拼多多参数
concurrency:
  group: update-pdd-params
  cancel-in-progress: false
on:
  schedule:
    - cron: '18 22,23,0,3,4,6,7,9,10,13,14 * * *'  # 北京时的6:18、7:18、8:18、11:18、12:18、14:18、15:18、17:18、18:18、21:18、22:18触发
  workflow_dispatch: {}  # 支持手动触发，无需验证码输入
  repository_dispatch:   # 新增:支持外部API触发
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    # 缓存 Node.js 二进制文件
    - name: 缓存 Node.js 二进制
      uses: actions/cache@v4
      id: node-binary-cache
      with:
        path: /opt/hostedtoolcache/node
        key: ${{ runner.os }}-node-binary-24.7.0
        restore-keys: |
          ${{ runner.os }}-node-binary-
    
    - name: 缓存|安装 Node.js及npm
      uses: actions/setup-node@v4
      with:
        node-version: '24.7.0'
        cache: 'npm'
        cache-dependency-path: 'package.json'
    
    # 缓存npm包和puppeteer浏览器，减少安装时间
    - name: 缓存|安装 puppeteer、npm、node_modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ~/.cache/puppeteer
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    # 恢复缓存（总是尝试）
    - name: 恢复puppeteer用户数据
      uses: actions/cache/restore@v4
      id: restore-cache
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-pdd-user-data-latest

    # 判断是否上传缓存（只在关键时间点上传）
    - name: 检查是否需要上传缓存
      id: check-upload
      run: |
        # 获取当前UTC小时
        CURRENT_HOUR=$(date -u +%H)
        
        # 定义需要上传的UTC小时（对应北京时间6,11,14,17,21点）
        UPLOAD_HOURS="22 03 06 09 13"
        
        # 检查当前小时是否在需要上传的列表中
        if [[ " $UPLOAD_HOURS " =~ " $CURRENT_HOUR " ]]; then
          echo "upload_cache=true" >> $GITHUB_OUTPUT
          echo "✅ 当前UTC时间 $CURRENT_HOUR:00 需要上传缓存（对应北京时间 $(((CURRENT_HOUR + 8) % 24)):00）"
        else
          echo "upload_cache=false" >> $GITHUB_OUTPUT
          echo "⏭️  当前UTC时间 $CURRENT_HOUR:00 跳过上传缓存（对应北京时间 $(((CURRENT_HOUR + 8) % 24)):00）"
        fi

    - name: 下载并安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          fonts-liberation \
          libasound2 \
          libatk-bridge2.0-0 \
          libatk1.0-0 \
          libc6 \
          libcairo2 \
          libcups2 \
          libdbus-1-3 \
          libexpat1 \
          libfontconfig1 \
          libgbm1 \
          libgcc1 \
          libglib2.0-0 \
          libgtk-3-0 \
          libnspr4 \
          libnss3 \
          libpango-1.0-0 \
          libpangocairo-1.0-0 \
          libstdc++6 \
          libx11-6 \
          libx11-xcb1 \
          libxcb1 \
          libxcomposite1 \
          libxcursor1 \
          libxdamage1 \
          libxext6 \
          libxfixes3 \
          libxi6 \
          libxrandr2 \
          libxrender1 \
          libxss1 \
          libxtst6 \
          lsb-release \
          wget \
          xdg-utils 
    
    - name: 安装依赖
      run: npm install
    
    - name: 运行更新脚本
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        PDD_ACCOUNTS_JSON: ${{ secrets.PDD_ACCOUNTS_JSON }}
        PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
        PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
        PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}

        TZ: Asia/Shanghai  # 固定时区为中国上海
      run: node scripts/update-pdd.js
    
    # 条件保存缓存（只在关键时间点上传）
    - name: 保存puppeteer用户数据
      if: steps.check-upload.outputs.upload_cache == 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ./puppeteer_user_data
        key: ${{ runner.os }}-pdd-user-data-latest
