name: 更新拼多多参数
on:
  schedule:
    - cron: '18 22,23,3,6,9,13,14 * * *'  # 北京时的6:18、7:18、11:18、14:18、17:18、21:18、22:18触发
  workflow_dispatch: {}  # 支持手动触发，无需验证码输入
  repository_dispatch:   # 新增:支持外部API触发
    types: [external_cron_trigger]

jobs:
  update:
    runs-on: ubuntu-22.04
    # 指定使用自定义 Docker 镜像
    container:
      image: ghcr.io/rickyones/pdd-crawler:latest  # 注意小写
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}  # 使用内置 token 拉取镜像（如果镜像公开可省略）

    steps:
      # 检出代码（注意：容器内会映射代码到 /app，但 actions/checkout 会将代码下载到容器的 $GITHUB_WORKSPACE）
      - uses: actions/checkout@v4

      # 缓存用户数据目录（与之前相同，容器内路径仍然有效）
      - name: Get date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 第一步：尝试恢复缓存
      - name: Restore puppeteer user data
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-user-data-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-pdd-user-data-

      # 由于镜像已安装所有依赖，无需再运行 npm install
      # 如果镜像未安装依赖，可以在此步骤运行，但建议在构建镜像时完成

      # 第二步：运行您的脚本（脚本会生成/更新 ./puppeteer_user_data 中的数据）
      - name: 运行更新脚本
        env:
          NODE_PATH: /app/node_modules  # 新增，让 Node 能找到镜像中的依赖
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDD_ACCOUNTS_JSON: ${{ secrets.PDD_ACCOUNTS_JSON }}
          PASSWORD_WANGXH03: ${{ secrets.PASSWORD_WANGXH03 }}
          PASSWORD_WANGXH04: ${{ secrets.PASSWORD_WANGXH04 }}
          PASSWORD_17752768679: ${{ secrets.PASSWORD_17752768679 }}
          TZ: Asia/Shanghai
        run: node scripts/update-pdd.js

      # 第三步：无论脚本执行成功与否，都保存更新后的缓存（关键改动）
      - name: Save puppeteer user data
        if: success()  # 确保脚本失败时不保存，仅成功时保存
        uses: actions/cache/save@v4
        with:
          path: ./puppeteer_user_data
          key: ${{ runner.os }}-pdd-user-data-${{ steps.date.outputs.date }}        