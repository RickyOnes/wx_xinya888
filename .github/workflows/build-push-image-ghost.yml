name: 创建带视频录制和鼠标轨迹的Docker镜像 to GHCR

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.ghost'
      - 'package-ghost.json'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write  # 需要写入包的权限
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动提供的 token
      
      - name: Build and push enhanced Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ghost
          push: true
          tags: |
            ghcr.io/rickyones/pdd-crawler-ghost:latest
            ghcr.io/rickyones/pdd-crawler-ghost:${{ github.sha }}